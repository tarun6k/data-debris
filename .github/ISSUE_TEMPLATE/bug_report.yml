name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Data loss or a security issue?** Do not file it here — see
        [SECURITY.md](../blob/main/SECURITY.md) and report it privately.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan with …
        2. Open Review, tick …
        3. Clean
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Data Debris version
      placeholder: "1.0 (123), or a commit SHA"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, M2 MacBook Air"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning / results
        - Review / cleaning
        - Undo / history
        - Duplicates
        - Auto Clean
        - Purchase / licensing
        - Settings / permissions
        - Other
    validations:
      required: true

  - type: textarea
    id: paths
    attributes:
      label: Paths involved
      description: >
        Helpful, but redact anything private — a shape like
        ~/Library/Caches/<app>/… is usually enough.
      render: text

  - type: checkboxes
    id: confirms
    attributes:
      label: Before filing
      options:
        - label: This is not a data-loss or security report (those go through SECURITY.md)
          required: true
        - label: I have not pasted any licence key, password or other secret
          required: true
