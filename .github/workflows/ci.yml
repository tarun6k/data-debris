name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # The project is generated from project.yml; DataDebris.xcodeproj is
      # gitignored, so it has to be created before anything can build.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Runs `xcodegen generate` first, then the DebrisCoreTests and
      # DebrisAppTests bundles. These are what hold the S1-S10 safety
      # invariants honest, so a red run blocks the merge.
      - name: Run tests
        run: make test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
