name: DataDebris

options:
  bundleIdPrefix: com.tarunkumar
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    GENERATE_INFOPLIST_FILE: YES

targets:
  DebrisCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DebrisCore
        excludes:
          - "Resources/**"
      - path: Sources/DebrisCore/Resources/catalogue.json
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunkumar.datadebris.core
        GENERATE_INFOPLIST_FILE: YES

  DataDebris:
    type: application
    platform: macOS
    sources:
      - path: Sources/DebrisApp
        excludes:
          - "Resources/**"
      - path: Sources/DebrisApp/Resources
        buildPhase: resources
    dependencies:
      - target: DebrisCore
        embed: true
      - package: Sparkle
        product: Sparkle
    # INFOPLIST_KEY_* build settings cannot express the CFBundleURLTypes
    # array, so the datadebris:// checkout callback lives in a generated
    # plist that Xcode merges with those settings.
    info:
      path: Sources/DebrisApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.tarunkumar.datadebris.checkout
            CFBundleURLSchemes: [datadebris]
        # Sparkle. The feed URL comes from AppConfig.plist (UpdateFeedURL)
        # through the updater delegate, so the privacy sheet, About and the
        # updater cannot disagree. The EdDSA public key is generated in 8B
        # (`generate_keys`); until then UpdateManager leaves the updater off.
        SUPublicEDKey: REPLACE_WITH_ED_PUBLIC_KEY
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunkumar.datadebris
        PRODUCT_NAME: DataDebris
        # CFBundleShortVersionString / CFBundleVersion come from these two
        # (the generated plist drops the keys when they are unset). Sparkle
        # compares CFBundleVersion, so bump CURRENT_PROJECT_VERSION on every
        # release; scripts/build-release.sh warns when that build is tagged.
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        # Resources/Assets.xcassets/AppIcon.appiconset, generated from
        # docs/design/AppIcon.png by scripts/make-icon.sh. actool also emits
        # Contents/Resources/AppIcon.icns, which make-dmg.sh reuses for the volume.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # "Empty Trash" asks Finder to do it, so Finder shows its own progress.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Data Debris asks Finder to empty the Trash when you choose Empty Trash. Nothing else is automated."

  # Hosted in the app: the standalone xctest agent fails to load unhosted
  # ad-hoc-signed bundles under this Xcode beta ("executable couldn't be located").
  DebrisCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DebrisCoreTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DebrisCore
      - target: DataDebris

  DebrisAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DebrisAppTests
    dependencies:
      - target: DataDebris

schemes:
  DataDebris:
    build:
      targets:
        DataDebris: all
    run:
      config: Debug
    test:
      config: Debug
      # The hosted test app boots the real AppModel; keep it off the real
      # profile, Keychain item and LaunchAgents (see AppPaths).
      environmentVariables:
        APP_SUPPORT_OVERRIDE: /tmp/DataDebris-tests
      targets:
        - DebrisCoreTests
        - DebrisAppTests
